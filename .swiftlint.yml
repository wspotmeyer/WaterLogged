# SwiftLint configuration for WaterLogged.
# Run from repo root: /opt/homebrew/bin/swiftlint

included:
  - WaterLogged

excluded:
  - WaterLogged/Libraries
  - WaterLoggedTests
  - .build
  - DerivedData
  - build

disabled_rules:
  - trailing_comma
  - todo
  # "divemaster" is a real PADI scuba certification term, not a bias issue.
  - inclusive_language
  # SwiftUI views commonly use multiple trailing closures (label + action).
  - multiple_closures_with_trailing_closure

# force_unwrapping is not opted in: ~45 existing legitimate cases
# (post-validation MapKit coordinates, C bridge code, XML parsing). Audit and
# re-enable as a separate, deliberate pass.

opt_in_rules:
  - closure_spacing
  - empty_string
  - first_where
  - last_where
  - sorted_first_last
  - toggle_bool

# unused_import requires compilation output, so it only runs under
# `swiftlint analyze`, not `swiftlint lint`.
analyzer_rules:
  - unused_import

line_length:
  warning: 260
  error: 360
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true
  ignores_interpolated_strings: true

file_length:
  warning: 1500
  error: 2500
  ignore_comment_only_lines: true

type_body_length:
  warning: 700
  error: 1000

function_body_length:
  warning: 250
  error: 400

function_parameter_count:
  warning: 8
  error: 12

cyclomatic_complexity:
  warning: 130
  error: 200

large_tuple:
  warning: 3
  error: 4

identifier_name:
  min_length:
    warning: 1
    error: 0
  excluded:
    - id
    - x
    - y
    - z
    - dx
    - dy
    - dz
    - to
    - in
    - on
    - at
    - of

nesting:
  type_level: 3

reporter: "xcode"
